<canvas class="home-meteors" data-home-meteors aria-hidden="true"></canvas>
<section class="container centered">
  <div class="about home-profile">
    {{ partialCached "home/avatar.html" . }}

    <div class="home-profile-details">
      {{- if .Site.Params.showHomeConstellation }}
        {{ partial "home/constellation.html" . }}
      {{- end }}
      {{ partialCached "home/author.html" . }}
      {{ partialCached "home/social.html" . }}
      {{ partial "home/music.html" . }}
    </div>
  </div>

  {{ partialCached "home/extensions.html" . }}
</section>
