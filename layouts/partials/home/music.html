<div class="home-music" data-background-music>
  <audio preload="metadata" data-start-time="80" data-fade-duration="5000">
    <source src="{{ "audio/ru-yue-er-zhi.mp3" | relURL }}" type="audio/mpeg">
  </audio>
  <span class="music-disc" aria-hidden="true"></span>
  <button class="music-toggle" type="button" aria-label="Play background music" aria-pressed="false" title="Play background music">
    <i class="fa-solid fa-play" aria-hidden="true"></i>
  </button>
  <span class="music-track" lang="zh" title="如约而至">如约而至</span>
  <i class="music-volume-icon fa-solid fa-volume-low" aria-hidden="true"></i>
  <input class="music-volume" type="range" min="0" max="100" step="1" value="35" aria-label="Music volume">
  <span class="music-error" role="status" hidden></span>
</div>
